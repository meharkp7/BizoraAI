
[build-system]
requires = ["setuptools>=75,<82", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "bizora"
version = "0.1.0"
description = "Evidence-grounded scientific methodology exploration and reproducible experiments."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [
    { name = "Bizora Contributors" },
]
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "structlog>=24,<26",
    "tenacity>=9,<10",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bizora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["bizora"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
